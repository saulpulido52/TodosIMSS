name: Verificar visualizador
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript y participación
        run: |
          node --check dist/app.js
          node --check dist/data.js
          node --test tests/participation.test.cjs
